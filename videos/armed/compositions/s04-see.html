          tl.fromTo('#s04-title .w', { yPercent: 115 }, { yPercent: 0, duration: 0.32, ease: 'expo.out', stagger: 0.045 }, 0.04)
          tl.fromTo('#s04-steps span', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.2, ease: 'expo.out', stagger: 0.03 }, 0.08)

          // the passes, one per beat: the tag and the step index are a pure function of time
          let shown = -1
          const state = A.driver((l) => {
            const k = Math.max(0, Math.min(3, Math.floor(l / B + 1e-6)))
            if (k === shown) return
            tag.innerHTML = `<b>0${k + 1}</b> ${STEP[k]}`
            steps.forEach((s, j) => s.classList.toggle('on', j === k))
            shown = k
          })
          tl.fromTo(state, { p: 0 }, { p: BAR, duration: BAR, ease: 'none' }, 0)
          ;[0, B, 2 * B, 3 * B].forEach((at) => tl.fromTo('#s04-tag', { scale: 1.35 }, { scale: 1, duration: 0.2, ease: 'back.out(2.4)', immediateRender: false }, at))
          // 02 edges: the photo cuts to its Sobel map, a scan bar draws it top to bottom
          tl.fromTo('#s04-img', { opacity: 1 }, { opacity: 0, duration: 0.001, ease: 'none', immediateRender: false }, B)
          tl.fromTo('#s04-edges', { opacity: 0, clipPath: 'inset(0 0 100% 0)' }, { opacity: 1, clipPath: 'inset(0 0 0% 0)', duration: 0.22, ease: 'power2.out' }, B)
          tl.fromTo('#s04-scan', { opacity: 0, y: 0 }, { opacity: 1, y: 896, duration: 0.22, ease: 'power2.out' }, B)
          tl.to('#s04-scan', { opacity: 0, duration: 0.06, ease: 'none' }, B + 0.22)
          // 03 features: the photo comes back dim, the corners pop as a radial wave
          tl.fromTo('#s04-img', { opacity: 0 }, { opacity: 0.55, duration: 0.001, ease: 'none', immediateRender: false }, 2 * B)
          tl.to('#s04-edges', { opacity: 0.32, duration: 0.12, ease: 'none' }, 2 * B)
          const pts = host.querySelectorAll('#s04-feat circle')
          pts.forEach((c) => {
            const x = +c.getAttribute('cx'), y = +c.getAttribute('cy')
            const d = Math.hypot(x - 450, y - 470) / 640
            tl.fromTo(c, { scale: 0, svgOrigin: `${x} ${y}` }, { scale: 1, svgOrigin: `${x} ${y}`, duration: 0.16, ease: 'back.out(3)' }, 2 * B + d * 0.26)
          })
          tl.fromTo('#s04-feat line', { opacity: 0 }, { opacity: 1, duration: 0.12, ease: 'none', stagger: 0.004 }, 2 * B + 0.18)
          // the facts land with the passes
          tl.fromTo('#s04-fig, #s04-fig-k', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.25, ease: 'expo.out', stagger: 0.04 }, B)
          tl.fromTo('#s04-place', { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.25, ease: 'expo.out' }, 2 * B)
          // 04 lock: brackets fly from the plate's corners onto the vehicle
          const [x0, y0, x1, y1] = BOX
          const corners = [['#s04-b1', 0, 0, x0, y0], ['#s04-b2', 836, 0, x1 - 64, y0], ['#s04-b3', 0, 836, x0, y1 - 64], ['#s04-b4', 836, 836, x1 - 64, y1 - 64]]
          corners.forEach(([s, fx, fy, tx, ty], i) => {
            tl.fromTo(s, { x: fx, y: fy, opacity: 0 }, { x: tx, y: ty, opacity: 1, duration: 0.24, ease: 'expo.out' }, 3 * B + i * 0.02)
          })
          tl.to('#s04-feat', { opacity: 0.45, duration: 0.1, ease: 'none' }, 3 * B)
          tl.fromTo('#s04-arch', { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.25, ease: 'expo.out' }, 3 * B)
          tl.fromTo('#s04-schem', { opacity: 0, x: -220, y: 120, rotation: -14 }, { opacity: 1, x: 0, y: 0, rotation: -4, duration: 0.3, ease: 'expo.out' }, 3 * B + 0.06)
          // exit: zoom through the frame into the next scene
          tl.to(me, { scale: 1.28, filter: 'blur(18px)', duration: 0.13, ease: 'power3.in' }, BAR - 0.13)
          window.__timelines['s04-see'] = tl
        })()
      </script>
    </template>
