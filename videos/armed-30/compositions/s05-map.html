="s05-card" style="background-position: -1760px 0"></div><div data-hf-id="hf-jtw3" class="s05-card" style="background-position: -1840px 0"></div></div>

        <div data-hf-id="hf-7b2p" id="s05-left" class="s05-m"><b data-hf-id="hf-oozh">309</b> frames<br data-hf-id="hf-szow"><b data-hf-id="hf-t4n0">1</b> sphere</div>

      <script>
        ;(function () {
          const A = window.ARMED
          const { B, BAR, E, prog, hash } = A
          const host = document.querySelector('[data-composition-id="s05-map"]')
          const me = host.querySelector('#root') || host
          const cards = [...host.querySelectorAll('.s05-card')]
          const framesEl = host.querySelector('#s05-frames')
          const N = cards.length
          const tl = gsap.timeline({ paused: true })

          // b16: arrive through the zoom: the real feature matches, and the inlier count
          tl.fromTo('#s05-match', { scale: 0.72, opacity: 0, filter: 'blur(18px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.3, ease: 'expo.out' }, 0)
          tl.fromTo('#s05-no, #s05-title', { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.25, ease: 'expo.out', stagger: 0.04 }, 0.02)
          tl.fromTo('#s05-match-k', { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'none' }, 0.12)
          tl.fromTo('#s05-inl', { opacity: 0, scale: 1.6, filter: 'blur(14px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.2, ease: 'expo.out' }, 0.08)
          tl.fromTo('#s05-inl-k', { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.25, ease: 'expo.out' }, 0.16)
          // b17: the pair is shoved off; the sweep's frames fan out across the frame
          tl.to('#s05-match', { x: -900, rotation: -8, duration: 0.18, ease: 'power3.in' }, B - 0.04)
          tl.to('#s05-match-k, #s05-inl, #s05-inl-k', { opacity: 0, duration: 0.08, ease: 'none' }, B - 0.04)
          tl.fromTo('#s05-frames, #s05-frames-k', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.2, ease: 'expo.out', stagger: 0.03 }, B)
          // cards: fly in fanned, then close ranks into one seamless sheet by 0.9 (the 3D sheet takes over)
          const card = A.driver((l) => {
            const fanIn = E.out(prog(l, B, B + 0.2))
            const close = E.inOut(prog(l, 0.64, 0.9))
            cards.forEach((c, i) => {
              const k = i - (N - 1) / 2
              const d = i * 0.006
              const fi = E.out(prog(l, B + d, B + 0.2 + d))
              const fanX = 960 + k * 74 - 40
              const fanY = 70 + k * k * 1.6
              const homeX = i * 80
              const x = (1 - close) * (fanX + (1 - fi) * 1400) + close * homeX
              const y = (1 - close) * fanY
              const rot = (1 - close) * k * 2.2
              const s = (1 - close) * 0.62 + close
              c.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${rot.toFixed(2)}deg) scale(${s.toFixed(4)})`
              c.style.boxShadow = close < 0.98 ? `0 0 0 ${(2 * (1 - close)).toFixed(2)}px rgba(251,245,234,0.5)` : 'none'
              c.style.opacity = l < B ? '0' : l >= 0.94 ? '0' : '1'
            })
            void fanIn
            framesEl.textContent = String(Math.round(309 * E.out(prog(l, B, B + 0.42)))).padStart(3, '0')
          })
          tl.fromTo(card, { p: 0 }, { p: BAR, duration: BAR, ease: 'none' }, 0)
          tl.to('#s05-frames, #s05-frames-k', { opacity: 0, duration: 0.08, ease: 'none' }, 0.86)
          tl.to('#s05-no, #s05-title', { opacity: 0, duration: 0.1, ease: 'none' }, 0.6)
          // b19: the sphere spins up; the sweep it holds
          tl.fromTo('#s05-deg', { opacity: 0, x: 140, filter: 'blur(18px)' }, { opacity: 1, x: 0, filter: 'blur(0px)', duration: 0.22, ease: 'expo.out' }, 3 * B)
          tl.fromTo('#s05-deg-k', { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'none' }, 3 * B + 0.1)
          tl.fromTo('#s05-left', { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.22, ease: 'expo.out' }, 3 * B + 0.04)
          // exit: a stepped glitch into heat
          tl.fromTo(me, { x: 0 }, { keyframes: [{ x: -46, duration: 1 / 60 }, { x: 38, duration: 1 / 60 }, { x: -22, duration: 1 / 60 }, { x: 64, duration: 1 / 60 }, { x: 0, duration: 1 / 60 }], immediateRender: false }, BAR - 5 / 60)
          window.__timelines['s05-map'] = tl
        })()
      </script>
