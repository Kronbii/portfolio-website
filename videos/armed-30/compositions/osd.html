<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>OSD — the flight feed's on-screen display (frames 1–3)</title>
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: 'JetBrains Mono'; src: url('assets/fonts/JetBrainsMono-500.ttf') format('truetype'); font-weight: 500; }
        @font-face { font-family: 'JetBrains Mono'; src: url('assets/fonts/JetBrainsMono-600.ttf') format('truetype'); font-weight: 600; }
        #root { position: absolute; inset: 0; pointer-events: none; }
        .osd-m { position: absolute; font-family: 'JetBrains Mono', monospace; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .osd-corner { position: absolute; width: 64px; height: 64px; border-color: rgba(251, 245, 234, 0.7); border-style: solid; border-width: 0; }
        #osd-c1 { left: 64px; top: 104px; border-top-width: 3px; border-left-width: 3px; }
        #osd-c2 { right: 64px; top: 104px; border-top-width: 3px; border-right-width: 3px; }
        #osd-c3 { left: 64px; bottom: 104px; border-bottom-width: 3px; border-left-width: 3px; }
        #osd-c4 { right: 64px; bottom: 104px; border-bottom-width: 3px; border-right-width: 3px; }
        #osd-cross { position: absolute; left: 920px; top: 500px; width: 80px; height: 80px; border: 2px solid rgba(251, 245, 234, 0.75); border-radius: 50%; }
        #osd-cross::before, #osd-cross::after { content: ''; position: absolute; background: rgba(251, 245, 234, 0.75); }
        #osd-cross::before { left: 38px; top: -22px; width: 2px; height: 18px; }
        #osd-cross::after { left: -22px; top: 38px; width: 18px; height: 2px; }
        #osd-horizon { position: absolute; left: 610px; top: 539px; width: 700px; height: 2px; transform-origin: 350px 1px; }
        #osd-horizon i { position: absolute; top: 0; height: 2px; width: 270px; background: rgba(251, 245, 234, 0.75); }
        #osd-horizon i:first-child { left: 0; }
        #osd-horizon i:last-child { right: 0; }
        #osd-horizon b { position: absolute; top: -10px; width: 2px; height: 12px; background: rgba(251, 245, 234, 0.75); }
        #osd-pill { left: 960px; top: 136px; transform-origin: 50% 50%; padding: 12px 26px; border-radius: 999px; border: 2px solid rgba(251, 245, 234, 0.6); font-size: 24px; color: rgba(251, 245, 234, 0.85); }
        #osd-pill.armed { background: #c9686a; border-color: #c9686a; color: #0e0b0b; font-weight: 600; }
        #osd-thr { position: absolute; left: 132px; top: 380px; width: 18px; height: 320px; border: 2px solid rgba(251, 245, 234, 0.6); }
        #osd-thr-fill { position: absolute; left: 2px; right: 2px; bottom: 2px; height: 312px; background: #c9686a; transform-origin: 50% 100%; }
        #osd-thr-v { left: 172px; top: 516px; font-size: 24px; color: #fbf5ea; }
        #osd-thr-k { left: 172px; top: 552px; font-size: 20px; color: rgba(251, 245, 234, 0.6); }
        .osd-r { right: 132px; text-align: right; font-size: 24px; color: #fbf5ea; }
        .osd-rk { right: 132px; text-align: right; font-size: 20px; color: rgba(251, 245, 234, 0.6); }
        #osd-roll { top: 470px; }
        #osd-roll-k { top: 506px; }
        #osd-alt { top: 580px; }
        #osd-alt-k { top: 616px; }
        #osd-foot { left: 960px; bottom: 120px; font-size: 20px; color: rgba(251, 245, 234, 0.6); }
        #osd-mode { left: 132px; top: 136px; font-size: 22px; color: rgba(251, 245, 234, 0.85); }
      </style>

      <div data-hf-id="hf-bdd7" id="root" data-composition-id="osd" data-width="1920" data-height="1080">
        <div data-hf-id="hf-sqi5" id="osd-c1" class="osd-corner"></div>
        <div data-hf-id="hf-wom6" id="osd-c2" class="osd-corner"></div>
        <div data-hf-id="hf-0mq7" id="osd-c3" class="osd-corner"></div>
        <div data-hf-id="hf-4ku8" id="osd-c4" class="osd-corner"></div>
        <div data-hf-id="hf-8owy" id="osd-cross"></div>
        <div data-hf-id="hf-45sz" id="osd-horizon"><i data-hf-id="hf-wt6k"></i><b data-hf-id="hf-3qbh" style="left: 349px"></b><i data-hf-id="hf-zeb8"></i></div>
        <div data-hf-id="hf-8mra" id="osd-mode" class="osd-m">Angle mode</div>
        <div data-hf-id="hf-i3y3" id="osd-pill" class="osd-m">Disarmed</div>
        <div data-hf-id="hf-lrdc" id="osd-thr"><div data-hf-id="hf-gkbe" id="osd-thr-fill"></div></div>
        <div data-hf-id="hf-4m8r" id="osd-thr-v" class="osd-m">000%</div>
        <div data-hf-id="hf-dg09" id="osd-thr-k" class="osd-m">Throttle</div>
        <div data-hf-id="hf-vl06" id="osd-roll" class="osd-m osd-r">+000.0°</div>
        <div data-hf-id="hf-hjb5" id="osd-roll-k" class="osd-m osd-rk">Roll</div>
        <div data-hf-id="hf-81mu" id="osd-alt" class="osd-m osd-r">0.00 m</div>
        <div data-hf-id="hf-dma7" id="osd-alt-k" class="osd-m osd-rk">Alt</div>
        <div data-hf-id="hf-jlzj" id="osd-foot" class="osd-m">Simulated flight · E58 model</div>
      </div>

      <script>
        ;(function () {
          const A = window.ARMED
          const { clamp, prog, E, beat, BAR } = A
          const host = document.querySelector('[data-composition-id="osd"]')
          const $ = (s) => host.querySelector(s)
          const me = host.querySelector('#root') || host
          const pill = $('#osd-pill')
          const fill = $('#osd-thr-fill')
          const thrV = $('#osd-thr-v')
          const roll = $('#osd-roll')
          const alt = $('#osd-alt')
          const horizon = $('#osd-horizon')
          const mode = $('#osd-mode')
          const foot = $('#osd-foot')
          const deg = (r) => {
            let d = (((r * 180) / Math.PI) % 360 + 540) % 360 - 180
            return (d < 0 ? '-' : '+') + Math.abs(d).toFixed(1).padStart(5, '0') + '°'
          }
          let state = ''
          function update(t) {
            const fpv = t >= 2 * BAR
            const f = A.flight(Math.min(t, 2 * BAR - 1e-3))
            const thr = fpv ? 0.62 + 0.06 * Math.sin(t * 7) : f.thr
            fill.style.transform = `scaleY(${clamp(thr).toFixed(3)})`
            thrV.textContent = String(Math.round(thr * 100)).padStart(3, '0') + '%'
            const r = fpv ? 0.09 * Math.sin((t - 2 * BAR) * 2.1) + 0.05 * Math.sin((t - 2 * BAR) * 5.3) : f.roll
            roll.textContent = deg(r)
            alt.textContent = (fpv ? 2.4 + 0.3 * Math.sin(t * 1.3) : Math.max(0, f.y) * 1.8).toFixed(2) + ' m'
            horizon.style.transform = `rotate(${((-r * 180) / Math.PI).toFixed(2)}deg)`
            const s = t < A.ARM_T ? 'dis' : 'arm'
            if (s !== state) {
              pill.textContent = s === 'dis' ? 'Disarmed' : 'Armed'
              pill.className = s === 'dis' ? 'osd-m' : 'osd-m armed'
              state = s
            }
            mode.textContent = fpv ? 'FPV · acro' : t >= beat(5) && t < 2.8 ? 'Acro · flip' : 'Angle mode'
            foot.textContent = fpv ? 'Camera feed · simulated' : 'Simulated flight · E58 model'
          }

          const tl = gsap.timeline({ paused: true })
          // entrances: the display boots in on the first beat
          tl.fromTo(host.querySelectorAll('.osd-corner'), { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.25, ease: 'expo.out', stagger: 0.03 }, 0.02)
          tl.fromTo('#osd-cross, #osd-horizon', { opacity: 0 }, { opacity: 1, duration: 0.12, ease: 'none', stagger: 0.04 }, 0.08)
          tl.fromTo('#osd-pill', { opacity: 0, xPercent: -50, y: -16 }, { opacity: 1, xPercent: -50, y: 0, duration: 0.25, ease: 'expo.out' }, 0.05)
          tl.fromTo('#osd-foot', { opacity: 0, xPercent: -50 }, { opacity: 1, xPercent: -50, duration: 0.2, ease: 'none' }, 0.15)
          tl.fromTo('#osd-thr, #osd-thr-v, #osd-thr-k, #osd-mode', { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.3, ease: 'expo.out', stagger: 0.03 }, 0.1)
          tl.fromTo('.osd-r, .osd-rk', { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.3, ease: 'expo.out', stagger: 0.03 }, 0.12)
          // ARMED: the pill punches
          tl.fromTo('#osd-pill', { scale: 1.6 }, { scale: 1, duration: 0.3, ease: 'back.out(2.4)', immediateRender: false }, A.ARM_T)
          // the dive: the display tunnels into the lens with the camera
          tl.fromTo(host.querySelectorAll('.osd-corner'), { x: 0, y: 0 }, { x: (i) => [180, -180, 180, -180][i], y: (i) => [120, 120, -120, -120][i], duration: 0.5, ease: 'power3.in', immediateRender: false }, 3.2)
          tl.to(me, { opacity: 0, duration: 0.08, ease: 'none' }, 3.62)
          // the feed: the display re-appears inside the drone's camera on the drop
          tl.fromTo(me, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: 'none', immediateRender: false }, 2 * BAR)
          tl.fromTo(host.querySelectorAll('.osd-corner'), { x: (i) => [-60, 60, -60, 60][i], y: (i) => [-40, -40, 40, 40][i] }, { x: 0, y: 0, duration: 0.35, ease: 'expo.out', immediateRender: false }, 2 * BAR)

          const driver = {}
          let v = 0
          Object.defineProperty(driver, 't', { get: () => v, set: (x) => { v = x; update(x) } })
          tl.to(driver, { t: 3 * BAR, duration: 3 * BAR, ease: 'none' }, 0)
          update(0)
          window.__timelines['osd'] = tl
        })()
      </script>
    </template>
  </body>
</html>
