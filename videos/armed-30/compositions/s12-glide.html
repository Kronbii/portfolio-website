      <script>
        ;(function () {
          const A = window.ARMED
          const { B, BAR } = A
          const host = document.querySelector('[data-composition-id="s12-glide"]')
          const frames = [...host.querySelectorAll('.s12-f')]
          const words = [...host.querySelectorAll('#s12-claim .w')]
          const STROBE = 6 * B // the last two beats
          const tl = gsap.timeline({ paused: true })
          tl.fromTo('#s12-horizon', { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.2, ease: 'power2.out' }, 0)
          tl.fromTo('#s12-cam, #s12-k', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'none', stagger: 0.1 }, 0.1)
          // the claim, one word per eighth; "sense" lands on the beat with weight
          const at = [0, 0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.25, 4.5]
          words.forEach((w, i) => {
            const big = i === 4
            tl.fromTo(w, { opacity: 0, y: big ? 0 : 50, scale: big ? 1.8 : 1, filter: 'blur(12px)' }, { opacity: 1, y: 0, scale: 1, filter: 'blur(0px)', duration: big ? 0.22 : 0.3, ease: big ? 'expo.out' : 'power3.out', transformOrigin: '0% 80%' }, at[i] * B)
          })
          // the strobe recap: eight real frames on sixteenths, hard cuts into the drop
          const strobe = A.driver((l) => {
            const k = l >= STROBE ? Math.min(7, Math.floor((l - STROBE) / (B / 4) + 1e-6)) : -1
            frames.forEach((f, i) => {
              f.style.opacity = i === k ? '1' : '0'
              if (i === k) {
                const u = (l - STROBE - k * (B / 4)) / (B / 4)
                f.style.transform = `scale(${(1.1 - 0.08 * u).toFixed(4)})`
              }
            })
          })
          tl.fromTo(strobe, { p: 0 }, { p: 2 * BAR, duration: 2 * BAR, ease: 'none' }, 0)
          window.__timelines['s12-glide'] = tl
        })()
      </script>
