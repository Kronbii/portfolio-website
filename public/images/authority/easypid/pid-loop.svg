<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Closed-loop PID control diagram: setpoint and measurement form an error, proportional, integral, and derivative terms are summed with anti-windup and filtering, the bounded output drives the plant, and the sensor feeds back.">
  <rect width="1600" height="1000" fill="#0c0c0c"/>
  <g fill="none" stroke="#3a3a3a" stroke-width="1">
    <path d="M0 500H1600M800 0V1000"/>
  </g>
  <g font-family="Zalando Sans, Segoe UI, system-ui, sans-serif" fill="#f5f5f5" font-size="30">
    <!-- setpoint -->
    <text x="90" y="470" font-size="26" fill="#a3a3a3">setpoint r(t)</text>
    <path d="M90 500H300" stroke="#f5f5f5" stroke-width="2"/>
    <!-- summing junction -->
    <circle cx="340" cy="500" r="40" stroke="#f5f5f5" stroke-width="2" fill="#0c0c0c"/>
    <text x="340" y="512" text-anchor="middle" font-size="40">Σ</text>
    <text x="300" y="590" font-size="26" fill="#a3a3a3">−</text>
    <text x="285" y="480" font-size="26" fill="#a3a3a3">+</text>
    <path d="M380 500H470" stroke="#f5f5f5" stroke-width="2"/>
    <text x="395" y="470" font-size="24" fill="#a3a3a3">e(t)</text>
    <!-- PID box -->
    <rect x="470" y="300" width="520" height="400" stroke="#f5f5f5" stroke-width="2" fill="#141414"/>
    <text x="500" y="350" font-size="28" fill="#a3a3a3">easyPID instance</text>
    <text x="500" y="420">P · e</text>
    <text x="500" y="490">I · ∫e dt</text>
    <text x="820" y="490" font-size="22" fill="#9d201a">anti-windup</text>
    <text x="500" y="560">D · de/dt</text>
    <text x="820" y="560" font-size="22" fill="#9d201a">low-pass filter</text>
    <text x="500" y="650" font-size="24" fill="#a3a3a3">dt: millis() or caller-supplied</text>
    <path d="M990 500H1080" stroke="#f5f5f5" stroke-width="2"/>
    <!-- limiter -->
    <rect x="1080" y="440" width="180" height="120" stroke="#f5f5f5" stroke-width="2" fill="#0c0c0c"/>
    <text x="1170" y="495" text-anchor="middle" font-size="26">output</text>
    <text x="1170" y="530" text-anchor="middle" font-size="26">limits</text>
    <path d="M1260 500H1350" stroke="#f5f5f5" stroke-width="2"/>
    <text x="1275" y="470" font-size="24" fill="#a3a3a3">u(t)</text>
    <!-- plant -->
    <rect x="1350" y="440" width="180" height="120" stroke="#9d201a" stroke-width="2" fill="#0c0c0c"/>
    <text x="1440" y="510" text-anchor="middle" font-size="28">plant</text>
    <!-- feedback -->
    <path d="M1440 560V760H340V540" stroke="#f5f5f5" stroke-width="2" fill="none"/>
    <rect x="800" y="720" width="200" height="80" stroke="#f5f5f5" stroke-width="2" fill="#0c0c0c"/>
    <text x="900" y="770" text-anchor="middle" font-size="26">sensor y(t)</text>
  </g>
</svg>
